<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Pesona NTT - Sleek Edition</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --neon-blue: #00f2ff;
            --neon-red: #ff2e63;
            --btn-grad: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --glass-card: rgba(7, 7, 10, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #131325 0%, #050508 100%);
        }

        /* --- 1. WELCOME SCREEN --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), 
                        url('https://unsplash.com') center/cover;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: 0.8s ease-in-out;
        }

        .title-gold {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .welcome-desc {
            max-width: 600px;
            font-size: 1.1rem;
            color: #eeeeee;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-start {
            padding: 20px 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: black;
            background: var(--gold);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--gold-glow);
            transition: 0.3s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px var(--gold-glow); }
        }

        /* --- 2. HUD & MAP --- */
        .status-bar { width: 90%; max-width: 500px; display: flex; justify-content: space-between; margin-bottom: 15px; z-index: 10; }
        .heart { font-size: 1.8rem; color: var(--neon-red); text-shadow: 0 0 12px var(--neon-red); transition: 0.5s; display: inline-block; margin-right: 5px; }
        .heart.lost { opacity: 0; transform: scale(0) translateY(-25px); }

        .adventure-map {
            width: 90%; max-width: 650px;
            height: 85px;
            background: rgba(255,255,255,0.05);
            border-radius: 45px;
            margin-bottom: 30px;
            position: relative;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
        }

        .map-line { position: absolute; top: 50%; left: 40px; right: 40px; height: 2px; background: rgba(255,255,255,0.08); z-index: 1; }
        .waypoint { width: 14px; height: 14px; background: #333; border-radius: 50%; z-index: 2; position: relative; transition: 0.5s; }
        .waypoint.active { background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }
        .waypoint-label { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #aaa; white-space: nowrap; font-weight: bold; }

        #player-icon {
            position: absolute; width: 40px; height: 40px;
            background: var(--gold); border-radius: 50%; z-index: 3;
            top: 50%; left: 40px; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 0 20px var(--gold); font-size: 1.4rem;
        }

        /* --- 3. CHALLENGE CARD (Sleek Update) --- */
        .quiz-card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            border: 2px solid var(--gold);
            border-radius: 30px;
            padding: 30px; /* Padding lebih ramping */
            text-align: center; 
            width: 95%; 
            max-width: 500px; /* Max-width lebih ringkas untuk laptop */
            box-shadow: 0 0 35px rgba(255,215,0,0.22);
            position: relative; 
            z-index: 100;
        }

        #q-tag { font-family: 'Orbitron', sans-serif; color: var(--gold); letter-spacing: 4px; font-size: 0.8rem; margin-bottom: 12px; font-weight: bold; }
        #question-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; color: white; }

        .option-btn {
            background: var(--btn-grad);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 20px; /* Padding lebih ramping */
            border-radius: 15px; 
            color: white; 
            cursor: pointer;
            font-size: 1rem; /* Ukuran font lebih proporsional */
            font-weight: 600; 
            transition: 0.3s; 
            width: 100%; 
            margin-bottom: 10px; /* Jarak antar tombol lebih rapat */
        }

        .option-btn:hover:not(:disabled):not(.wrong) { 
            border-color: var(--gold); box-shadow: 0 0 20px var(--neon-blue); color: var(--gold); transform: translateY(-3px);
        }

        .correct { background: linear-gradient(135deg, #00b09b, #96c93d) !important; border-color: #00ff84 !important; box-shadow: 0 0 20px #00ff84; }
        .wrong { background: linear-gradient(135deg, #cb2d3e, #ef473a) !important; border-color: #ff2e63 !important; animation: shake 0.4s; }

        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

        /* --- 4. RESULT SCOREBOARD --- */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.97);
            z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        .scoreboard {
            background: var(--glass-card);
            border: 3px solid var(--gold);
            border-radius: 35px;
            padding: 40px; width: 100%; max-width: 450px;
            text-align: center; box-shadow: 0 0 50px var(--gold-glow);
            animation: scoreIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 10000;
        }

        @keyframes scoreIn { from {opacity:0; transform:scale(0.8) translateY(30px)} to {opacity:1; transform:scale(1) translateY(0)} }

        .leaderboard { width: 100%; margin: 20px 0; border-collapse: collapse; }
        .leaderboard td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; color: #ddd; }
        .rank-icon { font-size: 1.2rem; margin-right: 10px; }

        /* --- 5. AUDIO & CANVAS --- */
        #mute-btn {
            position: fixed; bottom: 20px; left: 20px; z-index: 10001;
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold);
            color: var(--gold); width: 55px; height: 55px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <h1 class="title-gold">Pesona NTT</h1>
        <p class="welcome-desc">Jelajahi keindahan budaya, alam, dan sejarah Nusa Tenggara Timur melalui petualangan trivia interaktif yang menantang ini!</p>
        <button class="btn-start" onclick="mulaiPetualangan()">MULAI PETUALANGAN</button>
    </div>

    <!-- 2. STATUS HUD -->
    <div class="status-bar">
        <div id="hearts-container">
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>

        <div style="font-family: 'Orbitron', sans-serif; color: var(--gold); font-weight: bold;">
            SKOR: <span id="score-text">0</span>

    </div>

    <!-- 3. MAP ADVENTURE -->
    <div class="adventure-map">
        <div class="map-line"></div>
        <div id="player-icon">⛵</div>
        <div class="waypoint active"><span class="waypoint-label">KUPANG</span></div>

        <div class="waypoint"><span class="waypoint-label">FLORES</span></div>
        <div class="waypoint"><span class="waypoint-label">LABUAN BAJO</span></div>
    </div>

    <!-- 4. CHALLENGE CARD -->
    <div class="quiz-card">
        <div id="q-tag">TANTANGAN 1</div>
        <div id="question-text">Memuat pertanyaan keindahan NTT...</div>
        <div id="options-container">
            <!-- Tombol Pilihan Jawaban Bermunculan Di Sini -->
        </div>
    </div>

    <!-- 5. RESULT SCOREBOARD -->
